<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F8F4EF">
    <title>Sidan är låst</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        background: #F8F4EF;
        color: #545454;
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-size: 19px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        line-height: 1.55;
      }

      main {
        width: min(100% - 2rem, 760px);
        margin: 0 auto;
        padding: clamp(3rem, 10vw, 7rem) 0;
      }

      h1,
      h2,
      h3 {
        color: #93A5B2;
        font-family: "TAN Pearl", Brittany, Georgia, serif;
        font-weight: 400;
        line-height: 1.2;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        text-align: center;
      }

      h2 {
        margin: 3rem 0 1rem;
        font-size: 2rem;
      }

      h3 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.45rem;
      }

      p {
        margin: 0.75rem 0;
      }

      a {
        color: #718896;
        text-underline-offset: 0.2em;
      }

      .invitation {
        text-align: center;
      }

      .hero-photo {
        display: block;
        width: min(100%, 620px);
        height: auto;
        margin: 0 auto 2rem;
      }

      .rsvp {
        font-size: 1.2rem;
      }

      .contact {
        max-width: 620px;
        margin: 2rem auto 0;
      }

      .qa {
        margin-top: 4rem;
        border-top: 1px solid #d8d1c9;
        padding-top: 1rem;
      }

      .qa h3 {
        border-bottom: 1px solid #d8d1c9;
        padding-bottom: 0.5rem;
      }

      .password-gate {
        max-width: 440px;
        text-align: center;
      }

      .password-gate h1 {
        font-size: 2.4rem;
      }

      .password-gate label {
        display: block;
        margin-top: 1.5rem;
      }

      .password-gate input,
      .password-gate button {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.65rem;
        border: 1px solid #718896;
        border-radius: 4px;
        font: inherit;
      }

      .password-gate button {
        background: #545454;
        color: #F8F4EF;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="password-gate" id="password-gate">
      <h1>Sidan är låst</h1>
      <p>Ange lösenordet för att öppna sidan.</p>
      <form id="password-form">
        <label for="site-password">Lösenord</label>
        <input id="site-password" type="password" autocomplete="current-password" required aria-describedby="password-error">
        <button id="unlock-button" type="submit" disabled>Öppna sidan</button>
        <p id="password-error" role="status"></p>
      </form>
      <noscript><p>Du behöver aktivera JavaScript för att öppna sidan.</p></noscript>
    </main>
    <template id="site-content">
      <main id="wedding-content" tabindex="-1">
      <header class="invitation">
        <h1>Nike och Williams bröllop<br>1 maj 2027</h1>
        <img class="hero-photo" src="https://github.com/user-attachments/assets/3a540089-1c3e-433c-99c3-caa332d62cb0" alt="Två personer på en snötäckt fjälltopp">
        <p class="rsvp">
          Anmäl dig till bröllopet – klicka
          <a href="https://tally.so/r/b5JVQe" target="_blank" rel="noopener noreferrer">här</a>.
          OSA senast 14 februari 2027.
        </p>
        <p class="contact">
          Är du intresserad av att hålla tal? Hör av dig till Toast Masters Clara Berg och Johan på
          <a href="mailto:nikeochwilliam@gmail.com">nikeochwilliam@gmail.com</a>
          senast 1 april 2027. Clara och Johan kommer återkomma till dig i god tid innan bröllopet.
        </p>
      </header>

      <section class="qa" aria-labelledby="qa-heading">
        <h2 id="qa-heading">Q&amp;A</h2>
        <h3>Vigsel</h3>
        <p>Var gärna på plats senast 15 minuter innan vigseln börjar. Eftersom parkeringen vid kyrkan är begränsad rekommenderar vi att ni åker taxi eller kommunalt.</p>
        <h3>Transport till Kavallerimässen</h3>
        <p>Efter vigseln promenerar vi gemensamt till Kavallerimässen. Det tar cirka 15 minuter. Vid regn eller om ni inte önskar gå ansvarar varje gäst för att boka taxi. Se adressen till Kavallerimässen på inbjudan.</p>
        <h3>Kavallerimässen</h3>
        <p>Eftersom Kavallerimässen är ett skyddsobjekt måste ni visa giltig legitimation (pass, körkort eller nationellt ID-kort) vid inpassering. Det finns ingen parkering på plats.</p>
        <h3>Program för kvällen</h3>
        <p>Information om kvällens program kommer senare.</p>
        <h3>Övrigt (klädkod, presenter och barn)</h3>
        <p><strong>Klädkod: Smoking!</strong> Vi älskar att klä upp oss och hoppas att ni gör detsamma. Ni som äger en mässdräkt får gärna bära den!</p>
        <p><strong>Presenter:</strong> Vi är otroligt tacksamma för att ni vill fira denna dag med oss – den största gåvan är att ni är med. Om ni vill uppmärksamma oss tar vi tacksamt emot bidrag till vår bröllopsresa (se Swish-insamlingen på inbjudan). Vi tycker också om vackra och praktiska ting från KitchenLab, Svenskt Tenn, Wira Bruk och Rörstrand. Upplevelser, gärna sportiga och tillsammans med er, är också uppskattade!</p>
        <p><strong>Barn:</strong> Information kommer senare.</p>
      </section>
      </main>
    </template>
    <script>
      const SITE_PASSWORD = "snart2027";
      const UNLOCK_STORAGE_KEY = "wedding-site-unlocked";
      const form = document.getElementById("password-form");
      const password = document.getElementById("site-password");
      const error = document.getElementById("password-error");

      function unlockSite() {
        const content = document.getElementById("site-content");
        document.getElementById("password-gate").replaceWith(content.content.cloneNode(true));
        content.remove();
        document.title = "Nike och Williams bröllop 1 maj 2027";
        document.getElementById("wedding-content").focus();
      }

      document.getElementById("unlock-button").disabled = false;

      password.addEventListener("input", () => {
        password.removeAttribute("aria-invalid");
        error.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (password.value !== SITE_PASSWORD) {
          error.textContent = "Fel lösenord. Försök igen.";
          password.setAttribute("aria-invalid", "true");
          password.focus();
          return;
        }

        try {
          localStorage.setItem(UNLOCK_STORAGE_KEY, "true");
        } catch {
          // Allow access even when the browser cannot remember it.
        }
        unlockSite();
      });

      try {
        if (localStorage.getItem(UNLOCK_STORAGE_KEY) === "true") {
          unlockSite();
        }
      } catch {
        // Keep password entry available when browser storage is blocked.
      }
    </script>
  </body>
</html>
